# ==============================================================================
# AI IT OPERATIONS - STACK DE PRODUCTION HAUTE DISPONIBILITÉ & MULTI-SITES
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================
services:
  postgres:
    restart: always
    command:
      - "postgres"
      - "-c"
      - "max_connections=250"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    restart: always
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-aiops_redis_password}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "volatile-lru"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api-gateway:
    restart: always
    command:
      - "uvicorn"
      - "apps.api.src.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "4"
      - "--proxy-headers"
      - "--forwarded-allow-ips"
      - "*"
    environment:
      - ENVIRONMENT=production
      - LAB_MODE_ENABLED=false
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=40
      - REDIS_STREAM_MAXLEN=250000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  incident-worker:
    restart: always
    environment:
      - ENVIRONMENT=production
      - LAB_MODE_ENABLED=false
      - DB_POOL_SIZE=15
      - DB_MAX_OVERFLOW=30
      - REDIS_STREAM_MAXLEN=250000
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  prometheus:
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    security_opt:
      - no-new-privileges:true

  grafana:
    restart: always
    security_opt:
      - no-new-privileges:true
