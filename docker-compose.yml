services:
  # Base de données PostgreSQL 16 avec extension pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiops_postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: aiops_db
      POSTGRES_USER: aiops_user
      POSTGRES_PASSWORD: aiops_secure_password
    volumes:
      - aiops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops_user -d aiops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiops_internal

  # File de messages Redis Streams
  redis:
    image: redis:7-alpine
    container_name: aiops_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--requirepass", "aiops_redis_password"]
    volumes:
      - aiops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "aiops_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiops_internal

  # API Gateway FastAPI
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: aiops_api_gateway
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aiops_user:aiops_secure_password@postgres:5432/aiops_db
      - REDIS_URL=redis://:aiops_redis_password@redis:6379/0
      - LAB_MODE_ENABLED=true
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiops_internal

  # Worker d'orchestration des incidents (Zabbix -> GLPI -> LangGraph)
  incident-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: aiops_incident_worker
    restart: unless-stopped
    command: ["python", "-c", "import asyncio; from services.incident_worker.src.worker import incident_worker; asyncio.run(incident_worker.start())"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://aiops_user:aiops_secure_password@postgres:5432/aiops_db
      - REDIS_URL=redis://:aiops_redis_password@redis:6379/0
      - GLPI_API_URL=http://api-gateway:8000/api/v1/lab/glpi
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - api-gateway
    networks:
      - aiops_internal

  # Supervision Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: aiops_prometheus
    restart: unless-stopped
    ports:
      - "9095:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aiops_prometheus_data:/prometheus
    networks:
      - aiops_internal

  # Tableaux de bord Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: aiops_grafana
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_aiops_pass
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - aiops_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aiops_internal

networks:
  aiops_internal:
    driver: bridge

volumes:
  aiops_postgres_data:
  aiops_redis_data:
  aiops_prometheus_data:
  aiops_grafana_data:
