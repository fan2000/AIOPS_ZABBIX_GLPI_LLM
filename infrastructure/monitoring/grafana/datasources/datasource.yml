apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: false
    editable: true
    basicAuth: false
    jsonData:
      authType: "1"
      username: "Admin"
      trends: true
      disableDataAlignment: false
    secureJsonData:
      password: "zabbix"
