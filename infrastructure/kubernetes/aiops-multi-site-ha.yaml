# ==============================================================================
# AI IT OPERATIONS - MANIFESTES KUBERNETES PRODUCTION MULTI-SITES & HAUTE DISPO
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: aiops-production
  labels:
    app.kubernetes.io/part-of: ai-it-operations
    security.aiops.io/tier: zero-trust
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops-production
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LAB_MODE_ENABLED: "false"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "40"
  REDIS_STREAM_MAXLEN: "250000"
  CORRELATION_WINDOW_MINUTES: "15"
  LLM_PROVIDER: "ollama"
  OLLAMA_MODEL: "gemma4:latest"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-api-gateway
  namespace: aiops-production
  labels:
    app: aiops-api-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aiops-api-gateway
  template:
    metadata:
      labels:
        app: aiops-api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - aiops-api-gateway
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: api-gateway
          image: ghcr.io/enterprise/aiops-api-gateway:1.0.0
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: aiops-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aiops-api-gateway-pdb
  namespace: aiops-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aiops-api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiops-api-gateway-hpa
  namespace: aiops-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiops-api-gateway
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-incident-worker
  namespace: aiops-production
  labels:
    app: aiops-incident-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aiops-incident-worker
  template:
    metadata:
      labels:
        app: aiops-incident-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: incident-worker
          image: ghcr.io/enterprise/aiops-incident-worker:1.0.0
          envFrom:
            - configMapRef:
                name: aiops-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-zero-trust-netpol
  namespace: aiops-production
spec:
  podSelector:
    matchLabels:
      app: aiops-api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 11434
